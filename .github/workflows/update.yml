name: Update

on:
    workflow_dispatch:
        inputs:
            branch:
                description: 'Steam VR Branch'
                required: false
                default: 'public'
                type: string      

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: true

jobs:
    process:
        permissions:
            contents: write
        # TODO : switch to inherit for SteamTracking & the real repo
        #uses: steamtracking/gametracking/.github/workflows/gametracking.yml@master    
        uses: lifeismana/gametracking/.github/workflows/gametracking.yml@master
        #secrets: inherit
        secrets: 
            STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
            STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
        with:
          folder: csgo
          branch: ${{ github.event.inputs.branch }}
          run-on-windows: true
          appid: 730
